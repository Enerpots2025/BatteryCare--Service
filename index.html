<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatteryCare OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 1200px;
        }

        .app {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            min-height: 700px;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(90deg, #2c3e50, #4a6491);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 2rem;
            color: #00d4ff;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: #00d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff3742;
            transform: translateY(-2px);
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            padding: 18px 30px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            color: #2c3e50;
            border-bottom-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .tab:hover:not(.active) {
            background: rgba(0, 0, 0, 0.03);
        }

        .tab-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff4757;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dashboard View */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 5px solid;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card.pending {
            border-left-color: #ffa502;
        }

        .stat-card.in-progress {
            border-left-color: #1e90ff;
        }

        .stat-card.resolved {
            border-left-color: #2ed573;
        }

        .stat-card.engineers {
            border-left-color: #9c88ff;
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-card-header i {
            font-size: 2rem;
            opacity: 0.8;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        /* Complaints View */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #00d4ff;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #00d4ff;
            color: white;
            border-color: #00d4ff;
        }

        .filter-btn:hover:not(.active) {
            border-color: #00d4ff;
        }

        .complaints-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr 1.5fr 2fr 1fr 1fr 1fr;
            background: #f8f9fa;
            padding: 18px 25px;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 1px solid #e0e0e0;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr 2fr 1fr 1fr 1fr;
            padding: 18px 25px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
            transition: background 0.3s;
        }

        .table-row:hover {
            background: #f9f9f9;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
            text-align: center;
            min-width: 100px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-in-progress {
            background: #cce5ff;
            color: #004085;
        }

        .status-resolved {
            background: #d4edda;
            color: #155724;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .action-btn.assign {
            background: #007bff;
            color: white;
        }

        .action-btn.assign:hover {
            background: #0056b3;
        }

        .action-btn.view {
            background: #6c757d;
            color: white;
        }

        .action-btn.view:hover {
            background: #545b62;
        }

        /* Engineers View */
        .engineers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .engineer-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s;
        }

        .engineer-card:hover {
            transform: translateY(-5px);
        }

        .engineer-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .engineer-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .engineer-info h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        .engineer-info .specialty {
            color: #666;
            font-size: 0.9rem;
        }

        .engineer-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .count {
            font-size: 1.8rem;
            font-weight: 700;
            display: block;
            color: #2c3e50;
        }

        .stat-item .label {
            font-size: 0.85rem;
            color: #666;
        }

        .engineer-actions {
            display: flex;
            gap: 10px;
        }

        .engineer-actions .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-contact {
            background: #17a2b8;
            color: white;
        }

        .btn-contact:hover {
            background: #138496;
        }

        .btn-profile {
            background: #6c757d;
            color: white;
        }

        .btn-profile:hover {
            background: #545b62;
        }

        /* Settings View */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            margin-top: 20px;
        }

        .settings-nav {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .settings-nav-item {
            padding: 20px 25px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s;
            font-weight: 500;
            color: #555;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-nav-item:last-child {
            border-bottom: none;
        }

        .settings-nav-item.active {
            background: #f0f7ff;
            color: #007bff;
            border-left: 4px solid #007bff;
        }

        .settings-nav-item:hover:not(.active) {
            background: #f9f9f9;
        }

        .settings-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .settings-section {
            display: none;
        }

        .settings-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .btn-save {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn-save:hover {
            background: #218838;
        }

        /* Loading State */
        .loading-note {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 1.1rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #ff4757;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .table-header, .table-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .engineers-grid {
                grid-template-columns: 1fr;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .modal {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-note">
            <i class="fas fa-spinner fa-spin"></i> Loading BatteryCare OS...
        </div>
    </div>

    <script>
        // Mock database - In real app, this would be an API
        const mockDB = {

                },
                {

                },
                {

                    issue: "Battery replacement needed",
                    battery: "Livguard 12V 150Ah",
                    date: "2024-09-10",
                    status: "pending",
                    assignedTo: null
                }
            ],
            engineers: [
                {
                    id: "ENG001",
                    name: "Arun Sharma",
                    specialty: "Car Batteries",
                    contact: "9876543210",
                    complaintsHandled: 45,
                    successRate: "92%",
                    rating: 4.8,
                    available: true
                },
                {
                    id: "ENG002",
                    name: "Priya Patel",
                    specialty: "Inverter Batteries",
                    contact: "9876543211",
                    complaintsHandled: 38,
                    successRate: "95%",
                    rating: 4.9,
                    available: false
                },
                {
                    id: "ENG003",
                    name: "Rahul Verma",
                    specialty: "Industrial Batteries",
                    contact: "9876543212",
                    complaintsHandled: 52,
                    successRate: "88%",
                    rating: 4.6,
                    available: true
                },
                {
                    id: "ENG004",
                    name: "Sneha Gupta",
                    specialty: "Solar Batteries",
                    contact: "9876543213",
                    complaintsHandled: 29,
                    successRate: "96%",
                    rating: 4.7,
                    available: true
                }
            ],
            stats: {
                totalComplaints: 156,
                pendingComplaints: 23,
                inProgressComplaints: 8,
                resolvedComplaints: 125,
                totalEngineers: 12,
                activeEngineers: 8,
                monthlyRevenue: "₹2,45,000",
                customerSatisfaction: "94%"
            },
            user: {
                name: "Admin User",
                role: "System Administrator",
                email: "admin@batterycare.com",
                lastLogin: "2024-09-15 09:30:24"
            }
        };

        // App State
        let state = {
            currentView: 'dashboard',
            complaintFilter: 'all',
            settingsTab: 'profile',
            selectedComplaint: null,
            selectedEngineer: null,
            showModal: false,
            modalType: null,
            modalData: null
        };

        // DOM Elements
        let rootEl, appContainer;

        // Initialize app
        async function boot() {
            try {
                await simulateNetworkDelay();
                renderApp();
                bindEvents();
                
                // Load initial data
                await loadInitialData();
                
                console.log("BatteryCare OS initialized successfully");
            } catch (error) {
                console.error("Boot failed:", error);
                showError("Failed to load BatteryCare OS. Please refresh the page.");
            }
        }

        // Simulate network delay for demo
        function simulateNetworkDelay() {
            return new Promise(resolve => setTimeout(resolve, 800));
        }

        // Render main app
        function renderApp() {
            rootEl = document.getElementById('root');
            rootEl.innerHTML = `
                <div class="app">
                    <!-- Header -->
                    <div class="header">
                        <div class="logo">
                            <i class="fas fa-car-battery"></i>
                            <h1>BatteryCare OS</h1>
                        </div>
                        <div class="user-info">
                            <div class="user-avatar">${getInitials(mockDB.user.name)}</div>
                            <div>
                                <div style="font-weight: 600;">${mockDB.user.name}</div>
                                <div style="font-size: 0.9rem; opacity: 0.9;">${mockDB.user.role}</div>
                            </div>
                            <button class="logout-btn">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs">
                        <div class="tab ${state.currentView === 'dashboard' ? 'active' : ''}" data-view="dashboard">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </div>
                        <div class="tab ${state.currentView === 'complaints' ? 'active' : ''}" data-view="complaints">
                            <i class="fas fa-comments"></i> Complaints
                            <span class="tab-badge">${mockDB.complaints.filter(c => c.status === 'pending').length}</span>
                        </div>
                        <div class="tab ${state.currentView === 'engineers' ? 'active' : ''}" data-view="engineers">
                            <i class="fas fa-users-cog"></i> Service Engineers
                        </div>
                        <div class="tab ${state.currentView === 'settings' ? 'active' : ''}" data-view="settings">
                            <i class="fas fa-cog"></i> Settings
                        </div>
                    </div>

                    <!-- Content Area -->
                    <div class="content">
                        <div class="view ${state.currentView === 'dashboard' ? 'active' : ''}" id="dashboard-view">
                            ${renderDashboard()}
                        </div>
                        <div class="view ${state.currentView === 'complaints' ? 'active' : ''}" id="complaints-view">
                            ${renderComplaints()}
                        </div>
                        <div class="view ${state.currentView === 'engineers' ? 'active' : ''}" id="engineers-view">
                            ${renderEngineers()}
                        </div>
                        <div class="view ${state.currentView === 'settings' ? 'active' : ''}" id="settings-view">
                            ${renderSettings()}
                        </div>
                    </div>
                </div>

                <!-- Modal (hidden by default) -->
                ${state.showModal ? renderModal() : ''}
            `;

            appContainer = rootEl.querySelector('.app');
        }

        // Render Dashboard View
        function renderDashboard() {
            const stats = mockDB.stats;
            return `
                <h2 class="section-title">
                    <i class="fas fa-tachometer-alt"></i> Dashboard Overview
                </h2>
                
                <div class="dashboard-grid">
                    <div class="stat-card pending">
                        <div class="stat-card-header">
                            <i class="fas fa-clock"></i>
                            <span class="stat-number">${stats.pendingComplaints}</span>
                        </div>
                        <div class="stat-label">Pending Complaints</div>
                    </div>
                    
                    <div class="stat-card in-progress">
                        <div class="stat-card-header">
                            <i class="fas fa-tasks"></i>
                            <span class="stat-number">${stats.inProgressComplaints}</span>
                        </div>
                        <div class="stat-label">In Progress</div>
                    </div>
                    
                    <div class="stat-card resolved">
                        <div class="stat-card-header">
                            <i class="fas fa-check-circle"></i>
                            <span class="stat-number">${stats.resolvedComplaints}</span>
                        </div>
                        <div class="stat-label">Resolved</div>
                    </div>
                    
                    <div class="stat-card engineers">
                        <div class="stat-card-header">
                            <i class="fas fa-users"></i>
                            <span class="stat-number">${stats.totalEngineers}</span>
                        </div>
                        <div class="stat-label">Active Engineers</div>
                    </div>
                </div>
                
                <div style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                    <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                        <h3 style="margin-bottom: 20px; color: #2c3e50; display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-rupee-sign" style="color: #28a745;"></i> Monthly Revenue
                        </h3>
                        <div style="font-size: 2.2rem; font-weight: 700; color: #28a745;">${stats.monthlyRevenue}</div>
                        <div style="margin-top: 10px; color: #666; font-size: 0.9rem;">From ${stats.totalComplaints} complaints handled</div>
                    </div>
                    
                    <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                        <h3 style="margin-bottom: 20px; color: #2c3e50; display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-smile" style="color: #ffa502;"></i> Customer Satisfaction
                        </h3>
                        <div style="font-size: 2.2rem; font-weight: 700; color: #ffa502;">${stats.customerSatisfaction}</div>
                        <div style="margin-top: 10px; color: #666; font-size: 0.9rem;">Based on recent feedback</div>
                    </div>
                </div>
                
                <div style="margin-top: 40px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                    <h3 style="margin-bottom: 20px; color: #2c3e50;">Recent Activity</h3>
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        ${renderRecentActivity()}
                    </div>
                </div>
            `;
        }

        // Render Recent Activity
        function renderRecentActivity() {
            const recentComplaints = mockDB.complaints.slice(0, 4);
            return recentComplaints.map(complaint => `
                <div style="display: flex; align-items: center; padding: 12px; background: #f9f9f9; border-radius: 8px;">
                    <div style="width: 40px; height: 40px; background: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px;">
                        <i class="fas fa-battery-half" style="color: #6c757d;"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: 500;">${complaint.customer}</div>
                        <div style="font-size: 0.9rem; color: #666;">${complaint.issue}</div>
                    </div>
                    <div>
                        <span class="status-badge status-${complaint.status}">
                            ${complaint.status === 'pending' ? 'Pending' : 
                              complaint.status === 'in-progress' ? 'In Progress' : 'Resolved'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Render Complaints View
        function renderComplaints() {
            const filteredComplaints = state.complaintFilter === 'all' 
                ? mockDB.complaints 
                : mockDB.complaints.filter(c => c.status === state.complaintFilter);
            
            return `
                <h2 class="section-title">
                    <i class="fas fa-comments"></i> Customer Complaints
                </h2>
                
                <div class="filters">
                    <button class="filter-btn ${state.complaintFilter === 'all' ? 'active' : ''}" data-filter="all">
                        All (${mockDB.complaints.length})
                    </button>
                    <button class="filter-btn ${state.complaintFilter === 'pending' ? 'active' : ''}" data-filter="pending">
                        Pending (${mockDB.complaints.filter(c => c.status === 'pending').length})
                    </button>
                    <button class="filter-btn ${state.complaintFilter === 'in-progress' ? 'active' : ''}" data-filter="in-progress">
                        In Progress (${mockDB.complaints.filter(c => c.status === 'in-progress').length})
                    </button>
                    <button class="filter-btn ${state.complaintFilter === 'resolved' ? 'active' : ''}" data-filter="resolved">
                        Resolved (${mockDB.complaints.filter(c => c.status === 'resolved').length})
                    </button>
                </div>
                
                <div class="complaints-table">
                    <div class="table-header">
                        <div>Complaint ID</div>
                        <div>Customer</div>
                        <div>Issue</div>
                        <div>Battery</div>
                        <div>Status</div>
                        <div>Actions</div>
                    </div>
                    
                    ${filteredComplaints.map(complaint => `
                        <div class="table-row">
                            <div style="font-weight: 600; color: #2c3e50;">${complaint.id}</div>
                            <div>${complaint.customer}</div>
                            <div>${complaint.issue}</div>
                            <div>${complaint.battery}</div>
                            <div>
                                <span class="status-badge status-${complaint.status}">
                                    ${complaint.status === 'pending' ? 'Pending' : 
                                      complaint.status === 'in-progress' ? 'In Progress' : 'Resolved'}
                                </span>
                            </div>
                            <div>
                                ${complaint.status === 'pending' ? 
                                    `<button class="action-btn assign" data-id="${complaint.id}">
                                        <i class="fas fa-user-plus"></i> Assign
                                    </button>` : 
                                    `<button class="action-btn view" data-id="${complaint.id}">
                                        <i class="fas fa-eye"></i> View
                                    </button>`
                                }
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Render Engineers View
        function renderEngineers() {
            return `
                <h2 class="section-title">
                    <i class="fas fa-users-cog"></i> Service Engineers
                </h2>
                
                <div class="engineers-grid">
                    ${mockDB.engineers.map(engineer => `
                        <div class="engineer-card">
                            <div class="engineer-header">
                                <div class="engineer-avatar">${getInitials(engineer.name)}</div>
                                <div class="engineer-info">
                                    <h3>${engineer.name}</h3>
                                    <div class="specialty">${engineer.specialty}</div>
                                    <div style="font-size: 0.85rem; color: ${engineer.available ? '#28a745' : '#dc3545'}; margin-top: 5px;">
                                        <i class="fas fa-circle" style="font-size: 0.6rem;"></i> 
                                        ${engineer.available ? 'Available' : 'Busy'}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="engineer-stats">
                                <div class="stat-item">
                                    <span class="count">${engineer.complaintsHandled}</span>
                                    <span class="label">Handled</span>
                                </div>
                                <div class="stat-item">
                                    <span class="count">${engineer.successRate}</span>
                                    <span class="label">Success Rate</span>
                                </div>
                                <div class="stat-item">
                                    <span class="count">${engineer.rating}</span>
                                    <span class="label">Rating</span>
                                </div>
                            </div>
                            
                            <div class="engineer-actions">
                                <button class="btn btn-contact" data-id="${engineer.id}">
                                    <i class="fas fa-phone"></i> Contact
                                </button>
                                <button class="btn btn-profile" data-id="${engineer.id}">
                                    <i class="fas fa-user"></i> Profile
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Render Settings View
        function renderSettings() {
            return `
                <h2 class="section-title">
                    <i class="fas fa-cog"></i> Settings
                </h2>
                
                <div class="settings-grid">
                    <div class="settings-nav">
                        <div class="settings-nav-item ${state.settingsTab === 'profile' ? 'active' : ''}" data-tab="profile">
                            <i class="fas fa-user"></i> Profile Settings
                        </div>
                        <div class="settings-nav-item ${state.settingsTab === 'notifications' ? 'active' : ''}" data-tab="notifications">
                            <i class="fas fa-bell"></i> Notifications
                        </div>
                        <div class="settings-nav-item ${state.settingsTab === 'security' ? 'active' : ''}" data-tab="security">
                            <i class="fas fa-shield-alt"></i> Security
                        </div>
                        <div class="settings-nav-item ${state.settingsTab === 'billing' ? 'active' : ''}" data-tab="billing">
                            <i class="fas fa-credit-card"></i> Billing
                        </div>
                    </div>
                    
                    <div class="settings-content">
                        ${renderSettingsContent()}
                    </div>
                </div>
            `;
        }

        // Render Settings Content based on active tab
        function renderSettingsContent() {
            const user = mockDB.user;
            
            switch(state.settingsTab) {
                case 'profile':
                    return `
                        <div class="settings-section active" id="profile-settings">
                            <h3 style="margin-bottom: 25px; color: #2c3e50;">Profile Settings</h3>
                            
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" class="form-control" value="${user.name}" id="profile-name">
                            </div>
                            
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" class="form-control" value="${user.email}" id="profile-email">
                            </div>
                            
                            <div class="form-group">
                                <label>Role</label>
                                <input type="text" class="form-control" value="${user.role}" disabled>
                            </div>
                            
                            <div class="form-group">
                                <label>Last Login</label>
                                <input type="text" class="form-control" value="${user.lastLogin}" disabled>
                            </div>
                            
                            <button class="btn-save" id="save-profile">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                        </div>
                    `;
                    
                case 'notifications':
                    return `
                        <div class="settings-section active" id="notifications-settings">
                            <h3 style="margin-bottom: 25px; color: #2c3e50;">Notification Settings</h3>
                            
                            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                    <div>
                                        <div style="font-weight: 500;">New Complaint Alerts</div>
                                        <div style="font-size: 0.9rem; color: #666;">Get notified when new complaints are registered</div>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" checked>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                                
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                    <div>
                                        <div style="font-weight: 500;">Assignment Updates</div>
                                        <div style="font-size: 0.9rem; color: #666;">Notifications when engineers are assigned</div>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" checked>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                                
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="font-weight: 500;">Monthly Reports</div>
                                        <div style="font-size: 0.9rem; color: #666;">Receive monthly performance reports</div>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" checked>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>Email Frequency</label>
                                <select class="form-control">
                                    <option>Real-time</option>
                                    <option>Daily Digest</option>
                                    <option>Weekly Digest</option>
                                </select>
                            </div>
                            
                            <button class="btn-save">
                                <i class="fas fa-save"></i> Save Preferences
                            </button>
                        </div>
                    `;
                    
                default:
                    return `
                        <div class="settings-section active">
                            <h3 style="margin-bottom: 25px; color: #2c3e50;">${state.settingsTab.charAt(0).toUpperCase() + state.settingsTab.slice(1)} Settings</h3>
                            <p style="color: #666;">Settings content for ${state.settingsTab} will be available soon.</p>
                        </div>
                    `;
            }
        }

        // Render Modal
        function renderModal() {
            if (!state.showModal) return '';
            
            switch(state.modalType) {
                case 'assignEngineer':
                    return `
                        <div class="modal-overlay">
                            <div class="modal">
                                <div class="modal-header">
                                    <div class="modal-title">
                                        <i class="fas fa-user-plus"></i> Assign Service Engineer
                                    </div>
                                    <button class="modal-close">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <div class="form-group">
                                        <label>Select Engineer</label>
                                        <select class="form-control" id="engineer-select">
                                            <option value="">-- Select an engineer --</option>
                                            ${mockDB.engineers
                                                .filter(e => e.available)
                                                .map(e => `<option value="${e.id}">${e.name} - ${e.specialty}</option>`)
                                                .join('')}
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Assignment Notes</label>
                                        <textarea class="form-control" id="assignment-notes" rows="3" placeholder="Add any specific instructions..."></textarea>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn-secondary modal-close">Cancel</button>
                                    <button class="btn-primary" id="confirm-assign">Assign Engineer</button>
                                </div>
                            </div>
                        </div>
                    `;
                    
                case 'viewComplaint':
                    const complaint = mockDB.complaints.find(c => c.id === state.modalData);
                    if (!complaint) return '';
                    
                    return `
                        <div class="modal-overlay">
                            <div class="modal">
                                <div class="modal-header">
                                    <div class="modal-title">
                                        <i class="fas fa-eye"></i> Complaint Details
                                    </div>
                                    <button class="modal-close">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                                        <div>
                                            <div style="font-weight: 600; color: #666; margin-bottom: 5px;">Complaint ID</div>
                                            <div style="font-size: 1.1rem;">${complaint.id}</div>
                                        </div>
                                        <div>
                                            <div style="font-weight: 600; color: #666; margin-bottom: 5px;">Status</div>
                                            <span class="status-badge status-${complaint.status}">
                                                ${complaint.status === 'pending' ? 'Pending' : 
                                                  complaint.status === 'in-progress' ? 'In Progress' : 'Resolved'}
                                            </span>
                                        </div>
                                    </div>
                                    
                                    <div style="margin-bottom: 20px;">
                                        <div style="font-weight: 600; color: #666; margin-bottom: 5px;">Customer</div>
                                        <div style="font-size: 1.1rem;">${complaint.customer}</div>
                                    </div>
                                    
                                    <div style="margin-bottom: 20px;">
                                        <div style="font-weight: 600; color: #666; margin-bottom: 5px;">Issue</div>
                                        <div style="font-size: 1.1rem;">${complaint.issue}</div>
                                    </div>
                                    
                                    <div style="margin-bottom: 20px;">
                                        <div style="font-weight: 600; color: #666; margin-bottom: 5px;">Battery Details</div>
                                        <div style="font-size: 1.1rem;">${complaint.battery}</div>
                                    </div>
                                    
                                    <div style="margin-bottom: 20px;">
                                        <div style="font-weight: 600; color: #666; margin-bottom: 5px;">Date Reported</div>
                                        <div style="font-size: 1.1rem;">${complaint.date}</div>
                                    </div>
                                    
                                    ${complaint.assignedTo ? `
                                        <div style="margin-bottom: 20px;">
                                            <div style="font-weight: 600; color: #666; margin-bottom: 5px;">Assigned Engineer</div>
                                            <div style="font-size: 1.1rem;">
                                                ${mockDB.engineers.find(e => e.id === complaint.assignedTo)?.name || 'Unknown'}
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="modal-footer">
                                    <button class="btn-secondary modal-close">Close</button>
                                    ${complaint.status !== 'resolved' ? 
                                        `<button class="btn-primary" id="mark-resolved">Mark as Resolved</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                    
                default:
                    return '';
            }
        }

        // Helper functions
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase();
        }

        function showError(message) {
            rootEl.innerHTML = `
                <div class="loading-note">
                    <i class="fas fa-exclamation-circle" style="color: #ff4757;"></i>
                    <div style="margin-top: 10px;">${message}</div>
                    <button onclick="window.location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">
                        Retry
                    </button>
                </div>
            `;
        }

        // Event Binding
        function bindEvents() {
            // Tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const view = tab.dataset.view;
                    state.currentView = view;
                    renderApp();
                    bindEvents();
                });
            });

            // Complaint filters
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.complaintFilter = btn.dataset.filter;
                    renderApp();
                    bindEvents();
                });
            });

            // Settings tabs
            document.querySelectorAll('.settings-nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    state.settingsTab = item.dataset.tab;
                    renderApp();
                    bindEvents();
                });
            });

            // Assign buttons
            document.querySelectorAll('.action-btn.assign').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedComplaint = btn.dataset.id;
                    state.modalType = 'assignEngineer';
                    state.showModal = true;
                    renderApp();
                    bindEvents();
                });
            });

            // View buttons
            document.querySelectorAll('.action-btn.view').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.modalData = btn.dataset.id;
                    state.modalType = 'viewComplaint';
                    state.showModal = true;
                    renderApp();
                    bindEvents();
                });
            });

            // Engineer contact/profile buttons
            document.querySelectorAll('.btn-contact, .btn-profile').forEach(btn => {
                btn.addEventListener('click', () => {
                    const engineerId = btn.dataset.id;
                    const engineer = mockDB.engineers.find(e => e.id === engineerId);
                    if (btn.classList.contains('btn-contact')) {
                        alert(`Contacting ${engineer.name} at ${engineer.contact}`);
                    } else {
                        alert(`Showing profile of ${engineer.name}`);
                    }
                });
            });

            // Modal close buttons
            document.querySelectorAll('.modal-close').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.showModal = false;
                    state.modalType = null;
                    state.modalData = null;
                    renderApp();
                    bindEvents();
                });
            });

            // Confirm assignment
            const confirmAssignBtn = document.getElementById('confirm-assign');
            if (confirmAssignBtn) {
                confirmAssignBtn.addEventListener('click', () => {
                    const engineerSelect = document.getElementById('engineer-select');
                    const notes = document.getElementById('assignment-notes').value;
                    
                    if (!engineerSelect.value) {
                        alert('Please select an engineer');
                        return;
                    }

                    // Update complaint
                    const complaint = mockDB.complaints.find(c => c.id === state.selectedComplaint);
                    if (complaint) {
                        complaint.status = 'in-progress';
                        complaint.assignedTo = engineerSelect.value;
                        
                        // Update engineer availability
                        const engineer = mockDB.engineers.find(e => e.id === engineerSelect.value);
                        if (engineer) {
                            engineer.available = false;
                            engineer.complaintsHandled++;
                        }
                        
                        alert(`Engineer ${engineer.name} assigned to complaint ${complaint.id}`);
                    }

                    state.showModal = false;
                    state.modalType = null;
                    state.modalData = null;
                    renderApp();
                    bindEvents();
                });
            }

            // Mark as resolved
            const markResolvedBtn = document.getElementById('mark-resolved');
            if (markResolvedBtn) {
                markResolvedBtn.addEventListener('click', () => {
                    const complaint = mockDB.complaints.find(c => c.id === state.modalData);
                    if (complaint) {
                        complaint.status = 'resolved';
                        
                        // Make engineer available again
                        if (complaint.assignedTo) {
                            const engineer = mockDB.engineers.find(e => e.id === complaint.assignedTo);
                            if (engineer) engineer.available = true;
                        }
                        
                        alert(`Complaint ${complaint.id} marked as resolved`);
                    }

                    state.showModal = false;
                    state.modalType = null;
                    state.modalData = null;
                    renderApp();
                    bindEvents();
                });
            }

            // Save profile button
            const saveProfileBtn = document.getElementById('save-profile');
            if (saveProfileBtn) {
                saveProfileBtn.addEventListener('click', () => {
                    const name = document.getElementById('profile-name').value;
                    const email = document.getElementById('profile-email').value;
                    
                    mockDB.user.name = name;
                    mockDB.user.email = email;
                    
                    alert('Profile updated successfully!');
                });
            }

            // Logout button
            const logoutBtn = document.querySelector('.logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    if (confirm('Are you sure you want to logout?')) {
                        alert('Logged out successfully!');
                        // In real app, would redirect to login page
                    }
                });
            }
        }

        // Load initial data
        async function loadInitialData() {
            // Simulate API call
            await simulateNetworkDelay();
            // Data already loaded in mockDB
        }

        // Start the app
        boot();
    </script>
</body>
</html>
