<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lithium Battery Service Platform</title>
    <style>
        /* Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #00d4ff 0%, #00a8ff 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(0, 180, 216, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .logo span {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.3s;
        }

        .user-profile:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .user-profile img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* Main Layout */
        .main-container {
            display: flex;
            min-height: calc(100vh - 80px);
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #eee;
            padding: 25px 0;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.02);
        }

        .tabs {
            display: flex;
            flex-direction: column;
        }

        .tab {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: #555;
            font-weight: 500;
            border-left: 4px solid transparent;
            position: relative;
        }

        .tab:hover {
            background: #f8f9fa;
            color: #00a8ff;
        }

        .tab.active {
            background: rgba(0, 212, 255, 0.1);
            color: #00a8ff;
            border-left: 4px solid #00a8ff;
            font-weight: 600;
        }

        .tab i {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .tab-badge {
            position: absolute;
            right: 20px;
            background: #ff4757;
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
        }

        .stat-content h3 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .stat-content p {
            color: #666;
            font-size: 0.9rem;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #00a8ff 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #555;
            border: 1px solid #ddd;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
            border-color: #00a8ff;
            color: #00a8ff;
        }

        /* Tables */
        .complaints-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr 1fr 1fr;
            background: #f8f9fa;
            padding: 18px 25px;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #eee;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr 1fr 1fr;
            padding: 18px 25px;
            border-bottom: 1px solid #eee;
            align-items: center;
            transition: background 0.3s;
        }

        .table-row:hover {
            background: #f8f9fa;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        /* Status Badges */
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background: rgba(255, 165, 2, 0.15);
            color: #ffa502;
        }

        .status-in-progress {
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
        }

        .status-completed {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }

        .status-failed {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
        }

        /* Action Buttons */
        .action-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .action-btn.view {
            background: rgba(116, 185, 255, 0.15);
            color: #2d89ff;
        }

        .action-btn.assign {
            background: rgba(0, 212, 255, 0.15);
            color: #00a8ff;
        }

        .action-btn.complete {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }

        .action-btn.reject {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #00a8ff;
            box-shadow: 0 0 0 3px rgba(0, 168, 255, 0.1);
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #00a8ff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: #f8f9fa;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #eee;
                padding: 15px 0;
            }
            
            .tabs {
                flex-direction: row;
                overflow-x: auto;
                padding: 0 15px;
            }
            
            .tab {
                padding: 12px 20px;
                white-space: nowrap;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            
            .content {
                padding: 20px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .table-header,
            .table-row {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .table-header div:nth-child(4),
            .table-header div:nth-child(5),
            .table-row div:nth-child(4),
            .table-row div:nth-child(5) {
                display: none;
            }
        }
    </style>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-car-battery" style="font-size: 2rem;"></i>
            <div>
                <h1>Lithium Battery Service</h1>
                <span>Service Platform</span>
            </div>
        </div>
        <div class="user-profile" id="user-btn">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="User">

    <!-- Main Layout -->
    <div class="main-container">

        <nav class="sidebar">

                <div class="tab" data-view="complaints">

                </div>
                <div class="tab" data-view="engineers">

                </div>
                <!-- NEW TABS -->
                <div class="tab" data-view="oems">
                    <i class="fas fa-industry"></i> OEMs
                </div>
                <div class="tab" data-view="technicians">

                </div>
                <div class="tab" data-view="payouts">
                    <i class="fas fa-money-bill-wave"></i> Payouts
                </div>
                <div class="tab" data-view="services">
                    <i class="fas fa-tools"></i> Service Catalogue
                </div>
                <div class="tab" data-view="admin">
                    <i class="fas fa-cogs"></i> Admin Panel
                </div>
                <div class="tab" data-view="settings">
                    <i class="fas fa-cog"></i> Settings
                </div>
            </div>
        </nav>

        <!-- Content Area -->
        <div class="content" id="content">
            <!-- Content will be rendered here -->
        </div>
    </div>

    <script>
        // Application State
        const state = {
            currentView: 'dashboard',
            showModal: false,
            modalType: null,
            selectedComplaint: null
        };

        // Mock Database
        const mockDB = {

                { id: "CMP005", customer: "Vikram Mehta", phone: "9876543214", battery: "Gel Battery", issue: "Water level low", status: "pending", date: "2024-09-03", assignedTo: null },

                { id: "OEM002", companyName: "Amaron Batteries", contactPerson: "Priya Kapoor", email: "priya@amaron.com", phone: "9876543211", address: "Chennai, Tamil Nadu" },
                { id: "OEM003", companyName: "Livguard Energy", contactPerson: "Amit Sharma", email: "amit@livguard.com", phone: "9876543212", address: "Delhi NCR" }
            ],

            ],

                { id: "SVC002", name: "Battery Repair", description: "Repair of damaged battery cells", price: 2000, duration: "2 hours", category: "Repair", popularity: 65 },
                { id: "SVC003", name: "Water Top-Up", description: "Distilled water refill for lead-acid batteries", price: 500, duration: "30 mins", category: "Maintenance", popularity: 90 },
                { id: "SVC004", name: "Terminal Cleaning", description: "Cleaning and greasing of battery terminals", price: 300, duration: "20 mins", category: "Maintenance", popularity: 80 },
                { id: "SVC005", name: "Load Testing", description: "Full battery health check with load test", price: 800, duration: "45 mins", category: "Diagnostics", popularity: 75 }
            ]
        };

        // Render Application
        function renderApp() {
            const contentEl = document.getElementById('content');
            
            // Update pending badge
            const pendingBadge = document.getElementById('pending-count');
            pendingBadge.textContent = mockDB.complaints.filter(c => c.status === 'pending').length;
            
            // Update active tabs
            document.querySelectorAll('.tab').forEach(tab => {
                if (tab.dataset.view === state.currentView) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            // Render current view
            let contentHTML = '';
            switch(state.currentView) {
                case 'dashboard': contentHTML = renderDashboard(); break;
                case 'complaints': contentHTML = renderComplaints(); break;
                case 'engineers': contentHTML = renderEngineers(); break;
                case 'oems': contentHTML = renderOEMs(); break;
                case 'technicians': contentHTML = renderTechnicians(); break;
                case 'payouts': contentHTML = renderPayouts(); break;
                case 'services': contentHTML = renderServices(); break;
                case 'admin': contentHTML = renderAdmin(); break;
                case 'settings': contentHTML = renderSettings(); break;
                default: contentHTML = renderDashboard();
            }
            
            contentEl.innerHTML = contentHTML;
            
            // Render modal if needed
            if (state.showModal) {
                document.body.insertAdjacentHTML('beforeend', renderModal());
            }
            
            // Bind events after rendering
            bindEvents();
        }

        // View: Dashboard
        function renderDashboard() {
            return `
                <h2 class="section-title">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </h2>
                
                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">

                            <i class="fas fa-comments"></i>
                        </div>
                        <div class="stat-content">
                            <h3>${mockDB.stats.totalComplaints}</h3>
                            <p>Total Complaints</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon" style="background: linear-gradient(135deg, #ffa502 0%, #ff7b00 100%);">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-content">
                            <h3>${mockDB.stats.pendingComplaints}</h3>
                            <p>Pending Complaints</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon" style="background: linear-gradient(135deg, #2ed573 0%, #1dd1a1 100%);">
                            <i class="fas fa-users-cog"></i>
                        </div>
                        <div class="stat-content">
                            <h3>${mockDB.stats.activeEngineers}</h3>
                            <p>Active Engineers</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon" style="background: linear-gradient(135deg, #9c88ff 0%, #8c7ae6 100%);">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-content">
                            <h3>${mockDB.stats.avgResolutionTime}h</h3>
                            <p>Avg Resolution Time</p>
                        </div>
                    </div>
                </div>
                
                <!-- Quick Actions -->
                <h3 style="margin-bottom: 20px; color: #2c3e50;">Quick Actions</h3>
                <div style="display: flex; gap: 15px; margin-bottom: 40px;">
                    <button class="btn-primary" id="new-complaint">
                        <i class="fas fa-plus"></i> New Complaint
                    </button>
                    <button class="btn-secondary" id="view-analytics">
                        <i class="fas fa-chart-bar"></i> View Analytics
                    </button>
                    <button class="btn-secondary" id="quick-report">
                        <i class="fas fa-file-export"></i> Generate Report
                    </button>
                </div>
                
                <!-- Recent Complaints -->
                <h3 style="margin-bottom: 20px; color: #2c3e50;">Recent Complaints</h3>
                <div class="complaints-table">
                    <div class="table-header">
                        <div>ID</div>
                        <div>Customer</div>
                        <div>Battery</div>
                        <div>Issue</div>
                        <div>Status</div>
                        <div>Actions</div>
                    </div>
                    ${mockDB.complaints.slice(0, 4).map(complaint => `
                        <div class="table-row">
                            <div>${complaint.id}</div>
                            <div>${complaint.customer}</div>
                            <div>${complaint.battery}</div>
                            <div>${complaint.issue}</div>
                            <div>
                                <span class="status-badge status-${complaint.status}">
                                    ${complaint.status === 'pending' ? 'Pending' : 
                                      complaint.status === 'in-progress' ? 'In Progress' : 
                                      complaint.status === 'completed' ? 'Completed' : 'Failed'}
                                </span>
                            </div>
                            <div>
                                <button class="action-btn view" data-id="${complaint.id}">
                                    <i class="fas fa-eye"></i> View

                                    </div>
                                    <div style="margin-bottom: 15px;">
                                        <div style="font-weight: 600; color: #2c3e50;">Battery Type</div>
                                        <div>${complaint.battery}</div>
                                    </div>
                                    <div style="margin-bottom: 15px;">
                                        <div style="font-weight: 600; color: #2c3e50;">Issue</div>
                                        <div>${complaint.issue}</div>
                                    </div>
                                    <div style="margin-bottom: 15px;">
                                        <div style="font-weight: 600; color: #2c3e50;">Status</div>
                                        <span class="status-badge status-${complaint.status}">
                                            ${complaint.status === 'pending' ? 'Pending' : 
                                              complaint.status === 'in-progress' ? 'In Progress' : 
                                              complaint.status === 'completed' ? 'Completed' : 'Failed'}
                                        </span>
                                    </div>
                                    ${complaint.assignedTo ? `
                                        <div style="margin-bottom: 15px;">
                                            <div style="font-weight: 600; color: #2c3e50;">Assigned To</div>
                                            <div>${complaint.assignedTo}</div>
                                        </div>
                                    ` : ''}
                                    <div>
                                        <div style="font-weight: 600; color: #2c3e50;">Date</div>
                                        <div>${complaint.date}</div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn-primary modal-close">Close</button>
                                </div>
                            </div>
                        </div>
                    ` : '<div></div>';
                default:
                    return '<div></div>';
            }
        }

        // Event Binding
        function bindEvents() {
            // Tab Navigation
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    state.currentView = tab.dataset.view;
                    state.showModal = false;
                    state.modalType = null;
                    renderApp();
                });
            });

            // Complaint Actions
            document.querySelectorAll('.action-btn.view').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const complaint = mockDB.complaints.find(c => c.id === id);
                    if (complaint) {
                        state.selectedComplaint = id;
                        state.modalType = 'viewComplaint';
                        state.showModal = true;
                        renderApp();
                    }
                });
            });

            // Add Complaint
            document.getElementById('add-complaint')?.addEventListener('click', () => {
                state.showModal = false;
                const newComplaint = {
                    id: `CMP${String(mockDB.complaints.length + 1).padStart(3, '0')}`,
                    customer: `Customer ${mockDB.complaints.length + 1}`,
                    phone: `9876543${String(100 + mockDB.complaints.length).slice(-3)}`,
                    battery: "Lithium-ion Battery",
                    issue: "New complaint",
                    status: "pending",
                    date: new Date().toISOString().split('T')[0],
                    assignedTo: null
                };
                mockDB.complaints.unshift(newComplaint);
                mockDB.stats.totalComplaints++;
                mockDB.stats.pendingComplaints++;
                alert(`New complaint ${newComplaint.id} added!`);
                renderApp();
            });

            // Assign Engineer
            document.querySelectorAll('.action-btn.assign').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.dataset.id;
                    if (confirm('Assign this complaint to an engineer?')) {
                        const complaint = mockDB.complaints.find(c => c.id === id);
                        if (complaint) {
                            const engineer = mockDB.engineers.find(e => e.available);
                            if (engineer) {
                                complaint.status = 'in-progress';
                                complaint.assignedTo = engineer.id;
                                mockDB.stats.pendingComplaints--;
                                alert(`Complaint ${id} assigned to ${engineer.name}`);
                                renderApp();
                            } else {
                                alert('No available engineers!');
                            }
                        }
                    }
                });
            });

            // NEW: OEM Registration
            document.getElementById('add-oem')?.addEventListener('click', () => {
                state.modalType = 'addOEM';
                state.showModal = true;
                renderApp();
            });

            // NEW: Save OEM
            document.getElementById('save-oem')?.addEventListener('click', () => {
                const newOEM = {
                    id: `OEM${String(mockDB.oems.length + 1).padStart(3, '0')}`,
                    companyName: document.getElementById('oem-name').value,
                    contactPerson: document.getElementById('oem-contact').value,
                    email: document.getElementById('oem-email').value,
                    phone: document.getElementById('oem-phone').value,
                    address: document.getElementById('oem-address').value
                };
                mockDB.oems.push(newOEM);
                mockDB.stats.totalUsers++;
                state.showModal = false;
                alert(`OEM ${newOEM.companyName} registered successfully!`);
                renderApp();
            });

            // NEW: Technician Form
            document.getElementById('technician-form')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const newTechnician = {
                    id: `ENG${String(mockDB.engineers.length + 1).padStart(3, '0')}`,
                    name: document.getElementById('tech-name').value,
                    email: document.getElementById('tech-email').value,
                    phone: document.getElementById('tech-phone').value,
                    specialty: document.getElementById('tech-specialty').value,
                    experience: parseInt(document.getElementById('tech-experience').value) || 0,
                    address: document.getElementById('tech-address').value,
                    complaintsHandled: 0,
                    successRate: "0%",
                    rating: 0,
                    available: true,
                    bankDetails: {
                        bank: document.getElementById('tech-bank').value,
                        account: document.getElementById('tech-account').value,
                        ifsc: document.getElementById('tech-ifsc').value
                    }
                };
                mockDB.engineers.push(newTechnician);
                mockDB.stats.totalUsers++;
                alert(`Technician ${newTechnician.name} registered successfully!`);
                state.currentView = 'engineers';
                renderApp();
            });

            // NEW: Generate Payouts
            document.getElementById('generate-payouts')?.addEventListener('click', () => {
                const pendingPayouts = mockDB.payouts.filter(p => p.status === 'pending').length;
                alert(`Generated payouts for ${pendingPayouts} pending payments!`);
            });

            // NEW: Add Service
            document.getElementById('add-service')?.addEventListener('click', () => {
                const newService = {
                    id: `SVC${String(mockDB.services.length + 1).padStart(3, '0')}`,
                    name: `New Service ${mockDB.services.length + 1}`,
                    description: "Description of the new service",
                    price: Math.floor(Math.random() * 5000) + 500,
                    duration: "1 hour",
                    category: ["Replacement", "Repair", "Maintenance", "Diagnostics"][Math.floor(Math.random() * 4)],
                    popularity: Math.floor(Math.random() * 30) + 70
                };
                mockDB.services.push(newService);
                alert(`New service "${newService.name}" added!`);
                renderApp();
            });

            // NEW: Admin Actions
            document.getElementById('manage-users')?.addEventListener('click', () => {
                alert("User Management panel opened!");
            });

            // Close Modal
            document.querySelectorAll('.modal-close').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.showModal = false;
                    renderApp();
                });
            });

            // Close modal on overlay click
            document.querySelector('.modal-overlay')?.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal-overlay')) {
                    state.showModal = false;
                    renderApp();
                }
            });

            // Logout
            document.getElementById('logout-btn')?.addEventListener('click', () => {
                if (confirm('Are you sure you want to logout?')) {
                    alert('Logged out successfully!');
                    // In a real app, this would redirect to login page
                }
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
