<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BatteryCare OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161B;
  --surface:#1B2128;
  --surface-2:#222932;
  --border:#2C343D;
  --text:#EDEFF2;
  --muted:#8B95A1;
  --amber:#FFB020;
  --amber-dim:#5B4A21;
  --green:#4ADE80;
  --green-dim:#1F3D2C;
  --red:#F0554A;
  --red-dim:#3D2320;
  --blue:#5B9DF5;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  min-height:100vh;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--amber); color:#12161B;}

/* ---- Topbar ---- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#161B21,#12161B);
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{display:flex; gap:2px; align-items:flex-end;}
.brand-mark span{width:5px; background:var(--amber); border-radius:1px; display:block;}
.brand-mark span:nth-child(1){height:8px;}
.brand-mark span:nth-child(2){height:13px;}
.brand-mark span:nth-child(3){height:18px;}
.brand-mark span:nth-child(4){height:11px;}
.brand-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;}
.brand-sub{color:var(--muted); font-size:11px; margin-top:1px;}
.role-toggle{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px;}
.role-toggle button{
  border:none; background:transparent; color:var(--muted); padding:7px 16px; border-radius:999px;
  font-size:12.5px; font-weight:600; letter-spacing:.02em;
}
.role-toggle button.active{background:var(--amber); color:#12161B;}

/* ---- Layout ---- */
.layout{display:flex; min-height:calc(100vh - 58px);}
.sidebar{
  width:210px; border-right:1px solid var(--border); padding:16px 10px;
  flex-shrink:0; background:#151A20;
}
.sidebar .grp-label{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; padding:12px 10px 6px;}
.sidebar button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:transparent; border:none; color:var(--text); padding:9px 10px; border-radius:8px;
  font-size:13px; margin-bottom:1px;
}
.sidebar button:hover{background:var(--surface);}
.sidebar button.active{background:var(--surface-2); color:var(--amber); font-weight:600;}
.sidebar button .dot{width:6px; height:6px; border-radius:50%; background:var(--border); flex-shrink:0;}
.sidebar button.active .dot{background:var(--amber);}
.main{flex:1; padding:24px 28px; overflow-x:auto;}

/* ---- Page header ---- */
.page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; gap:16px; flex-wrap:wrap;}
.page-head h2{font-size:20px;}
.page-head p{color:var(--muted); font-size:12.5px; margin-top:4px;}
.btn{
  background:var(--amber); color:#12161B; border:none; padding:9px 16px; border-radius:8px;
  font-weight:600; font-size:13px;
}
.btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn.danger{background:var(--red-dim); color:var(--red); border:1px solid var(--red);}
.btn.small{padding:5px 10px; font-size:11.5px; border-radius:6px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* ---- KPI Cards ---- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:22px;}
.kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
.kpi-card .lbl{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em;}
.kpi-card .val{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; margin-top:6px;}
.kpi-card .sub{font-size:11px; color:var(--muted); margin-top:4px;}

/* Segmented battery gauge - signature element */
.gauge{display:flex; align-items:center; gap:8px;}
.gauge .cells{display:flex; gap:2px;}
.gauge .cell{width:7px; height:14px; border-radius:2px; background:var(--surface-2); border:1px solid var(--border);}
.gauge .cell.on-green{background:var(--green); border-color:var(--green);}
.gauge .cell.on-amber{background:var(--amber); border-color:var(--amber);}
.gauge .cell.on-red{background:var(--red); border-color:var(--red);}
.gauge .pct{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); min-width:34px;}

/* ---- Tables ---- */
.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  text-align:left; padding:10px 12px; background:var(--surface-2); color:var(--muted);
  font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#1F262E;}
.id-cell{font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:12px;}
.empty-row td{color:var(--muted); text-align:center; padding:26px; font-style:italic;}

/* Badges */
.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600;}
.badge.green{background:var(--green-dim); color:var(--green);}
.badge.amber{background:var(--amber-dim); color:var(--amber);}
.badge.red{background:var(--red-dim); color:var(--red);}
.badge.grey{background:var(--surface-2); color:var(--muted);}
.badge.blue{background:#1B2C47; color:var(--blue);}

/* ---- Modal ---- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(8,10,13,.65); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:12px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto;}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:15px;}
.modal-close{background:none; border:none; color:var(--muted); font-size:18px;}
.modal-body{padding:18px 20px; display:grid; gap:12px;}
.field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
.field input, .field select, .field textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:9px 10px; border-radius:7px; font-size:13px; font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:1.5px solid var(--amber);}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
.checkbox-row{display:flex; align-items:center; gap:8px;}
.checkbox-row input{width:auto;}

/* ---- Dispatch cards ---- */
.dispatch-grid{display:grid; gap:12px;}
.dispatch-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
.dispatch-card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.dispatch-card h4{font-size:14px;}
.dispatch-card .meta{color:var(--muted); font-size:12px; margin-top:4px;}
.match-list{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.match-chip{
  border:1px solid var(--border); background:var(--surface-2); border-radius:8px; padding:8px 10px; font-size:12px;
  display:flex; align-items:center; gap:8px;
}
.match-chip .score{color:var(--green); font-family:'IBM Plex Mono',monospace; font-weight:600;}
.match-chip button{background:var(--amber); color:#12161B; border:none; border-radius:6px; padding:5px 9px; font-size:11px; font-weight:700;}

/* ---- SOP checklist ---- */
.sop-steps{display:grid; gap:8px; margin-top:10px;}
.sop-step{display:flex; align-items:flex-start; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
.sop-step input{margin-top:2px;}
.sop-step .txt{font-size:12.5px;}
.sop-step .txt .evid{color:var(--muted); font-size:11px; margin-top:2px;}

/* ---- Field App ---- */
.field-frame-wrap{display:flex; justify-content:center; padding:10px 0 40px;}
.field-frame{
  width:390px; max-width:100%; background:#0F1318; border:1px solid var(--border); border-radius:26px;
  padding:16px; box-shadow:0 30px 60px rgba(0,0,0,.4);
}
.field-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.field-header select{background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-size:12.5px;}
.field-scorecard{background:linear-gradient(135deg,#1B2128,#20272F); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:14px;}
.field-scorecard .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
.field-scorecard .role{color:var(--muted); font-size:11.5px; margin-top:2px;}
.field-scorecard .stats{display:flex; gap:18px; margin-top:12px;}
.field-scorecard .stat .n{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700;}
.field-scorecard .stat .l{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}
.field-tabs{display:flex; gap:6px; margin-bottom:12px;}
.field-tabs button{flex:1; background:var(--surface); border:1px solid var(--border); color:var(--muted); padding:8px 0; border-radius:8px; font-size:11.5px; font-weight:600;}
.field-tabs button.active{background:var(--amber); color:#12161B; border-color:var(--amber);}
.job-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:10px;}
.job-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.job-card h4{font-size:13.5px;}
.job-card .desc{font-size:12px; color:var(--muted); margin-top:4px;}
.job-card .actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.job-card .actions button{flex:1; padding:8px 0; border-radius:7px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface-2); color:var(--text);}
.job-card .actions button.primary{background:var(--amber); color:#12161B; border-color:var(--amber);}
.empty-state{text-align:center; padding:40px 10px; color:var(--muted); font-size:12.5px;}
.empty-state .big{font-size:26px; margin-bottom:8px;}

.detail-modal .sop-steps{max-height:260px; overflow-y:auto;}
.helptext{font-size:11px; color:var(--muted); margin-top:-4px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:720px){
  .sidebar{display:none;}
  .main{padding:16px;}
  .grid2{grid-template-columns:1fr;}
}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--amber); color:var(--text); padding:10px 18px; border-radius:8px; font-size:12.5px; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.4);}
.loading-note{color:var(--muted); font-size:12.5px; padding:40px; text-align:center;}
</style>
</head>

<div id="root"></div>

<script>
/* =========================================================
   BatteryCare OS — data model, storage, and app shell
   ========================================================= */

/* =========================================================
   DATABASE CONFIG — REQUIRED BEFORE DEPLOYING
   =========================================================
   This app stores all data in a Firebase Realtime Database
   so every role (Ops, Field, OEM, Customer) sees the same
   live data, from any device, once hosted on GitHub Pages.

   SETUP (5 minutes, free):
   1. Go to https://console.firebase.google.com → Add project
      (you can turn off Google Analytics, not needed).
   2. In the left menu: Build → Realtime Database → Create Database.
      Choose a region, then start in "Test mode" (fine for a pilot —
      lock it down later with proper auth rules before wide rollout).
   3. Once created, copy the URL shown at the top of the Data tab —
      it looks like: https://YOUR-PROJECT-default-rtdb.REGION.firebasedatabase.app
   4. Paste that URL below, replacing FIREBASE_DB_URL's value.
   5. Save this file and re-upload to GitHub (or just edit the file
      directly on GitHub and commit).

   Until you do this, the app runs in "local demo mode": it works
   fully, but nothing is saved between page reloads.
   ========================================================= */
const FIREBASE_DB_URL = "https://batterycare-os-default-rtdb.firebaseio.com"; // connected
const DB_PATH = "batterycare-state";
const DB_CONFIGURED = !FIREBASE_DB_URL.includes("YOUR-PROJECT");

      {id:"OEM-0002", brand:"Amaron", contact:"Rohit Bhatia", mobile:"98200 66221", email:"rohit.b@amaron-service.com", citiesCovered:"Bengaluru", contractType:"Authorized Service Partner", warrantyRate:800, platformFee:12000, sla:"24 hr", status:"Active"}
    ],
    catalogue: [

      {code:"BC-INSTALL", name:"Battery Installation & Commissioning", level:"L2", category:"Installation", price:1500, payout:900, travel:0, partsSeparate:"Yes", warrantyEligible:"Yes", sla:"48 hr", active:"Yes"},
      {code:"BC-AMC", name:"AMC Preventive Visit", level:"L3", category:"AMC", price:1200, payout:700, travel:0, partsSeparate:"Yes", warrantyEligible:"Yes", sla:"Scheduled", active:"Yes"},
      {code:"BC-BESS", name:"BESS Specialist Visit", level:"L4", category:"BESS", price:5000, payout:3000, travel:0, partsSeparate:"Yes", warrantyEligible:"Yes", sla:"24 hr", active:"Yes"},

    ],

      {id:"SOP-02", process:"Warranty", step:3, owner:"Operations", mandatory:"Yes", evidence:"Claim submitted/closed"}
    ]
  };
}

let state = null;
let dbStatus = DB_CONFIGURED ? "connecting" : "unconfigured"; // unconfigured | connecting | connected | error
let ui = {
  role: "field",              // ops | field | oem | customer — field is primary: the service engineer completing jobs
  opsTab: "dashboard",
  fieldTechId: null,
  fieldTab: "jobs",
  oemId: null,
  oemTab: "report",
  customerTab: "report",
  customerMobile: "",
  customerLookup: "",
  modal: null,               // {type:'entity'|'assign'|'jobDetail', entityKey, recordId}
  toast: null
};

async function loadState(){
  if(!DB_CONFIGURED){
    dbStatus = "unconfigured";
    return seedState(); // local demo mode — nothing persists between reloads
  }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${DB_PATH}.json`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    dbStatus = "connected";
    if(data){ return data; }
    // nothing saved yet — seed the database
    const seeded = seedState();
    await fetch(`${FIREBASE_DB_URL}/${DB_PATH}.json`, {
      method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(seeded)
    });
    return seeded;
  }catch(e){
    dbStatus = "error";
    return seedState(); // fall back to local demo mode so the app still works
  }
}
async function saveState(){
  if(!DB_CONFIGURED) return; // local demo mode — nothing to save to
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${DB_PATH}.json`, {
      method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(state)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    dbStatus = "connected";
  }catch(e){
    dbStatus = "error";
    showToast("Save failed — check your database connection.");
  }
}
function showToast(msg){
  ui.toast = msg;
  render();
  setTimeout(()=>{ ui.toast=null; render(); }, 2400);
}
let pendingConfirm = null;
function askConfirm(message, onYes){
  pendingConfirm = onYes;
  ui.modal = {type:"confirm", message};
  render();
}

/* ---------- helpers ---------- */
function nextId(prefix, arr, field){
  let n = 1;
  arr.forEach(r=>{
    const m = String(r[field]||"").match(/(\d+)$/);
    if(m){ n = Math.max(n, parseInt(m[1],10)+1); }
  });
  return prefix + String(n).padStart(4,"0");
}
function fmtMoney(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function gaugeHTML(pct, cells=10){
  pct = Math.max(0, Math.min(100, Number(pct)||0));
  const on = Math.round((pct/100)*cells);
  const cls = pct>=70?"on-green":(pct>=40?"on-amber":"on-red");
  let html = '<div class="gauge"><div class="cells">';
  for(let i=0;i<cells;i++){ html += `<div class="cell ${i<on?cls:''}"></div>`; }
  html += `</div><span class="pct mono">${pct}%</span></div>`;
  return html;
}
function statusBadge(status){
  const map = {
    "Unassigned":"red","Assigned":"blue","In Progress":"amber","Completed":"green","Closed":"grey",
    "Active":"green","Inactive":"grey","Pending":"amber","Approved":"green","Rejected":"red","Paid":"green"
  };
  return `<span class="badge ${map[status]||'grey'}">${esc(status)}</span>`;
}

/* ---------- entity configs for generic CRUD ---------- */
const ENTITY = {
  technicians:{
    label:"Technician", idPrefix:"TECH-", idField:"id",
    columns:[["id","ID"],["name","Name"],["city","City"],["level","Level"],["brands","Brands"],["specialties","Specialties"],["status","Status"],["score","Score"]],

function saveEntity(entityKey, formData, recordId){
  const cfg = ENTITY[entityKey];
  const arr = state[entityKey];
  if(recordId){
    const idx = arr.findIndex(r=>r[cfg.idField]===recordId);
    if(idx>-1) arr[idx] = {...arr[idx], ...formData};
  }else{
    const id = nextId(cfg.idPrefix, arr, cfg.idField);
    const rec = {[cfg.idField]:id, ...formData};
    arr.push(rec);
  }
  saveState(); closeModal(); showToast("Saved.");
}
function deleteEntity(entityKey, id){
  const cfg = ENTITY[entityKey];
  state[entityKey] = state[entityKey].filter(r=>r[cfg.idField]!==id);
  saveState(); render(); showToast("Deleted.");
}

/* ---------- Job lifecycle logic ---------- */
function catalogueFor(code){ return state.catalogue.find(c=>c.code===code); }
function techFor(id){ return state.technicians.find(t=>t.id===id); }

function eligibleTechs(job){
  return state.technicians.filter(t=>{
    if(t.status!=="Active") return false;
    if((LEVEL_RANK[t.level]||0) < (LEVEL_RANK[job.requiredLevel]||0)) return false;
    if(t.city && job.city && t.city!==job.city) return false;
    if(t.brands && t.brands!=="All Brands" && job.brand && !t.brands.toLowerCase().includes(job.brand.toLowerCase())) return false;
    return true;
  }).sort((a,b)=> b.score - a.score);
}
function assignJob(jobId, techId){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  job.assignedTech = techId;
  job.status = "Assigned";
  saveState(); render(); showToast(`Assigned ${techId} to ${jobId}.`);
}
function advanceJobStatus(jobId, newStatus){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  job.status = newStatus;
  if(newStatus==="Completed" || newStatus==="Closed"){
    job.closureDate = job.closureDate || new Date().toISOString().slice(0,10);
    generatePayout(job);
    bumpTechStats(job);
  }
  saveState(); render();
}
function generatePayout(job){
  if(state.payouts.some(p=>p.jobId===job.id)) return; // already generated
  const cat = catalogueFor(job.serviceCode);
  const base = cat ? cat.payout : 0;
  const travel = cat ? cat.travel : 0;
  const partsHandling = Math.round((Number(job.partsCost)||0) * 0.10);
  const bonus = job.rating>=5 ? 100 : 0;
  const penalty = 0;
  const total = base+travel+partsHandling+bonus-penalty;
  job.techPayout = total;
  const id = nextId("PAY-", state.payouts, "id");
  state.payouts.push({
    id, jobId:job.id, techId:job.assignedTech, serviceCode:job.serviceCode,
    base, travel, partsHandling, bonus, penalty, total, approval:"Pending", paidDate:""
  });
}
function bumpTechStats(job){
  const t = techFor(job.assignedTech);
  if(t){ t.jobsCompleted = (t.jobsCompleted||0)+1; }
}
function markPayoutPaid(payoutId){
  const p = state.payouts.find(x=>x.id===payoutId);
  if(!p) return;
  p.approval="Approved"; p.paidDate = new Date().toISOString().slice(0,10);
  saveState(); render(); showToast("Payout marked paid.");
}

/* ---------- KPI computation ---------- */
function computeKPIs(){
  const jobs = state.jobs;
  const totalJobs = jobs.length;
  const completed = jobs.filter(j=>j.status==="Completed"||j.status==="Closed").length;
  const revenue = jobs.reduce((s,j)=>s+(Number(j.collected)||0),0);
  const techPayout = state.payouts.reduce((s,p)=>s+(Number(p.total)||0),0);
  const partsCost = jobs.reduce((s,j)=>s+(Number(j.partsCost)||0),0);
  const gross = revenue - techPayout - partsCost;
  const avgRev = completed ? Math.round(revenue/completed) : 0;
  const activeTechs = state.technicians.filter(t=>t.status==="Active").length;
  const ratedJobs = jobs.filter(j=>j.rating>0);
  const avgRating = ratedJobs.length ? (ratedJobs.reduce((s,j)=>s+Number(j.rating),0)/ratedJobs.length).toFixed(1) : "—";
  return {totalJobs, completed, revenue, techPayout, partsCost, gross, avgRev, activeTechs,
    oemAccounts: state.oems.length, batteries: state.batteries.length, avgRating};
}

function renderFieldApp(){
  const techs = state.technicians;
  if(!ui.fieldTechId && techs.length) ui.fieldTechId = techs[0].id;
  const tech = techFor(ui.fieldTechId);

  return `<div class="field-frame-wrap"><div class="field-frame">
    <div class="field-header">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700;">Field App</div>
      <select id="fieldTechSelect">${techs.map(t=>`<option value="${t.id}" ${t.id===ui.fieldTechId?'selected':''}>${esc(t.name)}</option>`).join("")}</select>
    </div>
    ${tech ? `
    <div class="field-scorecard">
      <div class="name">${esc(tech.name)}</div>
      <div class="role">${esc(tech.level)} · ${esc(tech.city)} · ${esc(tech.specialties)}</div>
      <div class="stats">
        <div class="stat"><div class="n">${tech.jobsCompleted||0}</div><div class="l">Jobs Done</div></div>
        <div class="stat"><div class="n">${tech.score}%</div><div class="l">Score</div></div>
        <div class="stat"><div class="n">${state.payouts.filter(p=>p.techId===tech.id && p.approval!=="Approved").length}</div><div class="l">Payouts Due</div></div>
      </div>
    </div>
    <div class="field-tabs">
      <button data-ftab="jobs" class="${ui.fieldTab==='jobs'?'active':''}">My Jobs</button>
      <button data-ftab="payouts" class="${ui.fieldTab==='payouts'?'active':''}">Payouts</button>
    </div>

    ` : `<div class="empty-state">Add a technician in Ops Console → Technicians first.</div>`}
  </div></div>`;
}

function renderFieldJobs(tech){
  const jobs = state.jobs.filter(j=>j.assignedTech===tech.id && j.status!=="Closed");
  if(!jobs.length) return `<div class="empty-state"><div class="big">📋</div>No active jobs assigned right now.</div>`;
  return jobs.map(j=>{
    const sopSteps = state.sop.filter(s=>s.id==="SOP-01");
    const checkedCount = sopSteps.filter(s=>j.sop && j.sop[s.step]).length;
    const allChecked = checkedCount===sopSteps.length;
    return `
    <div class="job-card">
      <div class="top">
        <div>
          <h4 class="mono">${j.id}</h4>
          <div class="desc">${esc(j.complaint)} · ${esc(j.city)}</div>
        </div>
        ${statusBadge(j.status)}
      </div>
      <div class="desc" style="margin-top:8px;">Checklist: ${checkedCount}/${sopSteps.length} steps done</div>
      <div class="actions">
        ${j.status==="Assigned" ? `<button class="primary" data-fstatus="${j.id}|In Progress">Start Job</button>` : ""}
        <button data-fopen="${j.id}">Checklist</button>
        ${j.status==="In Progress" ? `<button class="primary" data-fcomplete="${j.id}" ${allChecked?'':'disabled'}>Complete</button>` : ""}
      </div>
    </div>`;
  }).join("");
}
function renderFieldPayouts(tech){
  const payouts = state.payouts.filter(p=>p.techId===tech.id);
  if(!payouts.length) return `<div class="empty-state"><div class="big">₹</div>No payouts yet — complete a job to generate one.</div>`;
  return payouts.map(p=>`
    <div class="job-card">
      <div class="top">
        <div><h4 class="mono">${p.jobId}</h4><div class="desc">${esc(p.serviceCode)}</div></div>
        ${statusBadge(p.approval==="Approved"?"Paid":"Pending")}
      </div>
      <div class="desc" style="margin-top:8px; font-size:14px; color:var(--text); font-weight:600;">${fmtMoney(p.total)}</div>
    </div>`).join("");
}

        <button class="primary" data-customer-close="${j.id}">Confirm & Close Job</button>
      </div>` : ""}
    ${j.status==="Closed" ? `<div class="desc" style="margin-top:8px; color:var(--green);">✓ Closed — thanks for using BatteryCare.</div>` : ""}
  </div>`;
}


/* =========================================================
   EVENT WIRING
   ========================================================= */
function attachHandlers(){
  const root = document.getElementById("root");

  root.querySelectorAll("[data-role]").forEach(b=> b.onclick = ()=>{ ui.role=b.dataset.role; render(); });
  root.querySelectorAll("[data-tab]").forEach(b=> b.onclick = ()=>{ ui.opsTab=b.dataset.tab; render(); });
  root.querySelectorAll("[data-ftab]").forEach(b=> b.onclick = ()=>{ ui.fieldTab=b.dataset.ftab; render(); });
  root.querySelectorAll("[data-oemtab]").forEach(b=> b.onclick = ()=>{ ui.oemTab=b.dataset.oemtab; render(); });
  root.querySelectorAll("[data-ctab]").forEach(b=> b.onclick = ()=>{ ui.customerTab=b.dataset.ctab; render(); });
  root.querySelectorAll("[data-customer-find]").forEach(b=> b.onclick = ()=>{
    const val = document.getElementById("customerMobileInput").value.trim();
    ui.customerLookup = val;
    render();
  });
  root.querySelectorAll("[data-customer-close]").forEach(b=> b.onclick = ()=>{
    advanceJobStatus(b.dataset.customerClose, "Closed");
    showToast("Job closed — thanks for confirming!");
  });
  root.querySelectorAll("[data-oem-callback]").forEach(b=> b.onclick = ()=>{
    const job = state.jobs.find(j=>j.id===b.dataset.oemCallback);
    if(job){ job.callbackRequestedAt = new Date().toISOString(); saveState(); }
    showToast(`Callback requested. BatteryCare's desk (${BATTERYCARE_CALLBACK_NUMBER}) will call you shortly.`);
    render();
  });

  const oemSel = document.getElementById("oemSelect");
  if(oemSel) oemSel.onchange = (e)=>{ ui.oemId = e.target.value; render(); };

  const techSel = document.getElementById("fieldTechSelect");
  if(techSel) techSel.onchange = (e)=>{ ui.fieldTechId = e.target.value; render(); };

  root.querySelectorAll("[data-add]").forEach(b=> b.onclick = ()=> openAddModal(b.dataset.add));
  root.querySelectorAll("[data-edit]").forEach(b=> b.onclick = ()=>{ const [k,id]=b.dataset.edit.split("|"); openEditModal(k,id); });
  root.querySelectorAll("[data-delete]").forEach(b=> b.onclick = ()=>{ const [k,id]=b.dataset.delete.split("|"); askConfirm(`Delete this ${ENTITY[k].label.toLowerCase()} record?`, ()=>deleteEntity(k,id)); });

  root.querySelectorAll("[data-add-job]").forEach(b=> b.onclick = ()=>{ ui.modal={type:"job"}; render(); });
  root.querySelectorAll("[data-del-job]").forEach(b=> b.onclick = ()=>{ const id=b.dataset.delJob; askConfirm("Delete this job?", ()=>{ state.jobs = state.jobs.filter(j=>j.id!==id); saveState(); render(); }); });
  root.querySelectorAll("[data-job-detail]").forEach(b=> b.onclick = ()=>{ ui.modal={type:"jobDetail", recordId:b.dataset.jobDetail}; render(); });
  root.querySelectorAll("[data-fopen]").forEach(b=> b.onclick = ()=> openFieldChecklist(b.dataset.fopen));

  root.querySelectorAll("[data-assign]").forEach(b=> b.onclick = ()=>{ const [jobId,techId]=b.dataset.assign.split("|"); assignJob(jobId,techId); });
  root.querySelectorAll("[data-pay]").forEach(b=> b.onclick = ()=> markPayoutPaid(b.dataset.pay));

  root.querySelectorAll("[data-fstatus]").forEach(b=> b.onclick = ()=>{ const [id,st]=b.dataset.fstatus.split("|"); advanceJobStatus(id,st); });
  root.querySelectorAll("[data-fcomplete]").forEach(b=> b.onclick = ()=>{ ui.modal = {type:"fieldComplete", recordId: b.dataset.fcomplete}; render(); });

  root.querySelectorAll("[data-status]").forEach(b=> b.onclick = ()=>{
    const [jobId,newStatus] = b.dataset.status.split("|");
    const job = state.jobs.find(j=>j.id===jobId);
    if(b.dataset.withFields && job){
      job.collected = Number(document.getElementById("jobCollected").value)||0;
      job.partsCost = Number(document.getElementById("jobParts").value)||0;
      job.rootCause = document.getElementById("jobRootCause").value;
      job.rating = Number(document.getElementById("jobRating").value)||0;
    }
    advanceJobStatus(jobId, newStatus);
    closeModal();
  });

  root.querySelectorAll("[data-sop-check]").forEach(cb=> cb.onchange = ()=>{
    const [jobId, step] = cb.dataset.sopCheck.split("|");
    const job = state.jobs.find(j=>j.id===jobId);
    if(!job) return;
    job.sop = job.sop || {};
    job.sop[step] = cb.checked;
    saveState();
    // re-render but keep modal open on same job
    render();
  });

  root.querySelectorAll("[data-close-modal]").forEach(el=> el.onclick = (e)=>{ if(e.target===el) closeModal(); });
  root.querySelectorAll("[data-stop]").forEach(el=> el.onclick = (e)=> e.stopPropagation());

  const confirmYesBtn = root.querySelector("[data-confirm-yes]");
  if(confirmYesBtn) confirmYesBtn.onclick = ()=>{ const fn = pendingConfirm; pendingConfirm=null; closeModal(); if(fn) fn(); };

  const fcBtn = root.querySelector("[data-save-field-complete]");
  if(fcBtn) fcBtn.onclick = ()=>{
    const jobId = fcBtn.dataset.saveFieldComplete;
    const job = state.jobs.find(j=>j.id===jobId);
    if(job){
      job.collected = Number(document.getElementById("fcCollected").value)||0;
      job.partsCost = Number(document.getElementById("fcParts").value)||0;
      job.rootCause = document.getElementById("fcRootCause").value;
      job.rating = Number(document.getElementById("fcRating").value)||0;
    }
    advanceJobStatus(jobId, "Completed");
    closeModal();
    showToast("Job completed — payout generated.");
  };

  const saveEntityBtn = root.querySelector("[data-save-entity]");
  if(saveEntityBtn) saveEntityBtn.onclick = ()=>{
    const [entityKey, recordId] = saveEntityBtn.dataset.saveEntity.split("|");
    const form = document.getElementById("entityForm");
    const data = {};
    ENTITY[entityKey].fields.forEach(f=>{ data[f.key] = form.elements[f.key].value; });
    saveEntity(entityKey, data, recordId||null);
  };
  const saveJobBtn = root.querySelector("[data-save-job]");
  if(saveJobBtn) saveJobBtn.onclick = ()=>{
    const form = document.getElementById("jobForm");
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    const cat = catalogueFor(data.serviceCode);
    const id = nextId("BC-2026-", state.jobs, "id");
    state.jobs.push({
      id, ...data, assignedTech:"", status:"Unassigned",
      quoted: cat?cat.price:0, collected:0, techPayout:0, partsCost:0, rootCause:"", closureDate:"", rating:0, sop:{}, source:"Ops", oemId:"", callbackRequestedAt:""
    });
    saveState(); closeModal(); showToast("Job created and sent to Dispatch Board.");
  };

  const oemReportBtn = root.querySelector("[data-save-oem-report]");
  if(oemReportBtn) oemReportBtn.onclick = ()=>{
    const oemId = oemReportBtn.dataset.saveOemReport;
    const oem = state.oems.find(o=>o.id===oemId);
    const form = document.getElementById("oemReportForm");
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    const cat = state.catalogue.find(c=>c.code==="BC-DIAG"); // default intake service; ops can re-code after triage
    const id = nextId("BC-2026-", state.jobs, "id");
    state.jobs.push({
      id, ...data, brand: oem.brand, serviceCode: cat?cat.code:"BC-DIAG",
      assignedTech:"", status:"Unassigned",
      quoted: cat?cat.price:0, collected:0, techPayout:0, partsCost:0, rootCause:"", closureDate:"", rating:0, sop:{},
      source:"OEM", oemId: oem.id, callbackRequestedAt:""
    });
    saveState();
    form.reset();
    ui.oemTab = "tracker";
    render();
    showToast(`Issue reported — ${id} sent to Dispatch Board.`);
  };

  const customerReportBtn = root.querySelector("[data-save-customer-report]");
  if(customerReportBtn) customerReportBtn.onclick = ()=>{
    const form = document.getElementById("customerReportForm");
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    const cat = state.catalogue.find(c=>c.code==="BC-DIAG");
    const id = nextId("BC-2026-", state.jobs, "id");
    const priority = (data.priority||"P2").split(" ")[0]; // strip the descriptive suffix
    state.jobs.push({
      id, ...data, priority, requiredLevel:"L2", serviceCode: cat?cat.code:"BC-DIAG",
      assignedTech:"", status:"Unassigned",
      quoted: cat?cat.price:0, collected:0, techPayout:0, partsCost:0, rootCause:"", closureDate:"", rating:0, sop:{},
      source:"Customer", oemId:"", callbackRequestedAt:""
    });
    saveState();
    form.reset();
    ui.customerTab = "tracker";
    ui.customerLookup = data.mobile;
    render();
    showToast(`Request submitted — ${id}. Save your mobile number to track it.`);
  };
}

/* =========================================================
   BOOT
   ========================================================= */
async function boot(){
  document.getElementById("root").innerHTML = `<div class="loading-note">Loading BatteryCare OS…</div>`;
  state = await loadState();
  render();
}
boot();
</script>
</body>
</html>
